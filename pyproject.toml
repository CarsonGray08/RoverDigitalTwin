[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rover-twin"
version = "2.0.0"
description = "Live digital twin of the UCF RASSOR rover: iPhone mapping, Isaac Sim physics, and an API for planning software."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "Pillow>=9",
  "scipy>=1.10,<2",
  "tomli>=2; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "usd-core>=25.8,<27"]   # USD without Isaac, for the twin's stage tests

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
pythonpath = ["tools"]
